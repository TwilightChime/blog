spring.application.name=blog

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

server.port=8080

logging.level.com.blog=debug

file.upload.path=./uploads/
file.upload.max-size=52428800
file.upload.allowed-types=image/jpeg,image/jpg,image/png,image/gif,image/ico
file.upload.thumbnail.width=200
file.upload.thumbnail.height=200